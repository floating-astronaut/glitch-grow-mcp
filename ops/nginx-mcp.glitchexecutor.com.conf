# /etc/nginx/sites-available/mcp.glitchexecutor.com
#
# Reverse proxy for the multi-tenant Glitch Grow MCP server.
# Streamable-HTTP needs long-lived connections + buffering off, similar to
# the existing meta-ads-mcp / amazon-ads-mcp sites. Mirror their pattern.
#
# Activation steps (NOT done automatically — run manually after DNS + cert):
#   1. Add A record:  mcp.glitchexecutor.com  →  this box
#   2. sudo cp ops/nginx-mcp.glitchexecutor.com.conf /etc/nginx/sites-available/mcp.glitchexecutor.com
#   3. sudo ln -s ../sites-available/mcp.glitchexecutor.com /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d mcp.glitchexecutor.com
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mcp.glitchexecutor.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.glitchexecutor.com;

    # Reuse the existing wildcard *.glitchexecutor.com cert (no separate certbot run needed).
    ssl_certificate     /etc/letsencrypt/live/glitchexecutor.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glitchexecutor.com-0001/privkey.pem;

    # Healthz is public for monitoring; everything else is bearer-gated upstream.
    location = /healthz {
        proxy_pass http://127.0.0.1:3106/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable-HTTP / SSE: don't buffer, keep connections open
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
